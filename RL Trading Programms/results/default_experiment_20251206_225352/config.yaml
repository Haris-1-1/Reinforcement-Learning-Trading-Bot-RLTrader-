agent:
  dqn:
    batch_size: 64
    buffer_size: 100000
    exploration_final_eps: 0.05
    exploration_fraction: 0.1
    exploration_initial_eps: 1.0
    gamma: 0.99
    gradient_steps: 1
    learning_rate: 0.0001
    learning_starts: 1000
    policy_kwargs:
      net_arch:
      - 128
      - 128
    target_update_interval: 1000
    tau: 0.005
    train_freq: 4
  ppo:
    batch_size: 64
    clip_range: 0.2
    ent_coef: 0.0
    gae_lambda: 0.95
    gamma: 0.99
    learning_rate: 0.0003
    max_grad_norm: 0.5
    n_epochs: 10
    n_steps: 2048
    policy_kwargs:
      net_arch:
      - 128
      - 128
    vf_coef: 0.5
  q_learning:
    epsilon_decay: 0.995
    epsilon_end: 0.01
    epsilon_start: 1.0
    gamma: 0.99
    learning_rate: 0.1
    n_bins: 20
  type: dqn
data:
  end_date: '2024-01-01'
  interval: 1d
  start_date: '2020-01-01'
  symbol: BTC-USD
  test_split: 0.2
environment:
  enable_execution_delay: false
  execution_delay_steps: 0
  initial_cash: 10000.0
  max_position_size: 1.0
  min_position_size: 0.0
  slippage: 0.001
  trade_frequency_penalty: 0.0001
  trading_fee_maker: 0.001
  trading_fee_taker: 0.002
experiment:
  compare_with_baseline: true
  description: Default configuration experiment
  enable_constraints: true
  name: default_experiment
  seed: 42
training:
  eval_freq: 5000
  log_interval: 1000
  n_eval_episodes: 5
  save_freq: 10000
  save_path: results/
  tensorboard_log: results/tensorboard/
  total_timesteps: 100000
